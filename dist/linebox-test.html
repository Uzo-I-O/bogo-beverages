<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face {
        font-family: Poppins;
        src: url("/fonts/Poppins-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: Poppins;
        src: url("/fonts/Poppins-SemiBold.ttf") format("truetype");
        font-weight: 700;
      }
      body {
        margin: 0;
        font-family: Poppins, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        display: block;
        font-size: 20px;
        line-height: 30px;
        margin-right: 10px;
        font-weight: 700;
      }
      img {
        width: 25px;
        margin-right: 15px;
        height: auto;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <a href="#"><img src="/images/fb.svg" alt="" /></a>
  </body>
</html>
